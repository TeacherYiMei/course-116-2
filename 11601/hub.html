<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闖關地圖 · 116-1 資訊科技</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<script src="config.js"></script>
<script src="../shared/firebase-config.js?v=16.35"></script>
<script src="../shared/firebase-sync.js?v=16.50"></script>
<script src="../shared/semester.js"></script>
<script src="../shared/store.js?v=16.51"></script>
<script src="../shared/ui.js?v=16.50"></script>
<script src="../shared/k12.js"></script>
<script src="../shared/learncard.js"></script>
<script src="../shared/hub.js?v=16.35"></script>
<style>
.extension-card{border-top:6px solid #7c3aed!important;background:linear-gradient(140deg,#fff,#f5f3ff)}
.extension-card .ext-chip{display:inline-block;border-radius:999px;background:#ede9fe;color:#6d28d9;padding:6px 13px;font-size:.82rem;font-weight:800}
.extension-card .ext-stat{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-weight:800;font-size:.9rem}
.extension-card .ext-bar{height:12px;background:#e5e7eb;border-radius:12px;overflow:hidden;margin-top:10px}
.extension-card .ext-bar i{display:block;height:100%;background:#7c3aed;border-radius:12px}
</style></head>
<body>
<main class="wrap">
  <div class="row small" style="margin-bottom:1rem"><a class="back" href="../index.html?stay">← 總入口</a></div>
  <div id="hub"><p class="soft">載入中…</p></div>
</main>
<script>
function drawExtensionCard(){
  if (!window.STORE || !STORE.me()) return;
  var root=document.querySelector('#hub > section.grid.g2');
  if (!root) return;
  var s=Math.max(0,Math.min(18,Number(STORE.moduleStars('extension')||0)));
  var pct=Math.round(s/18*100);
  var done=0;
  ['E1','E2','E3','E4','E5','E6'].forEach(function(id){
    try { if (STORE.levelStars('extension',id)>=3) done++; }catch(e){}
  });
  var status=s>=18?'✅ 完成':s>0?'進行中':'尚未開始';
  var card=document.getElementById('extension-map-card');
  if (!card){
    card=document.createElement('a');card.id='extension-map-card';
    card.className='card pop extension-card';card.href='extension.html';
    card.style.cssText='text-decoration:none;border-top:6px solid #7c3aed';
    root.appendChild(card);
  }
  card.innerHTML='<div class="row between"><span class="ext-chip">🧭 跨章延伸 · 統整挑戰</span><span class="tiny bold soft">'+status+'</span></div>'+
    '<div class="row mt2" style="align-items:flex-start;flex-wrap:nowrap"><div style="font-size:2.4rem;line-height:1">🧭</div><div><h2 style="font-size:1.25rem" class="black">數位科技任務中心</h2><p class="small soft bold">6 站 · 18 顆星 · 3 種跨章徽章</p></div></div>'+
    '<p class="small mt1">統整數位時代、Python、系統平臺，進行跨章任務。Python 自行輸入程式，不提供複製答案。</p>'+
    '<div class="ext-stat"><span>⭐ '+s+' / 18 · '+pct+'%</span><span class="soft">'+done+' / 6 關</span></div>'+
    '<div class="ext-bar"><i style="width:'+pct+'%"></i></div>';
}
function refreshExtensionMap(){setTimeout(drawExtensionCard,0)}
UI.requireLogin(function(){HUB.render();drawExtensionCard();});
window.addEventListener('store:change',refreshExtensionMap);
window.addEventListener('pageshow',refreshExtensionMap);
window.addEventListener('focus',refreshExtensionMap);
</script>

<style>
.knowledge-card{border-top:6px solid #0c9db8!important;background:linear-gradient(130deg,#fff,#effcff);text-decoration:none}
.knowledge-card .kn-badge{background:#cdf8f3;color:#075d69;border-radius:40px;padding:6px 12px;font-weight:900}
.knowledge-card .kn-progress{height:12px;background:#dcebef;border-radius:30px;overflow:hidden;margin-top:12px}
.knowledge-card .kn-progress i{height:100%;background:#06a8ba;display:block;transition:width .3s}
</style>
<script>
(function(){
 function showKnowledge(){
   const root=document.querySelector('#hub > section.grid.g2');
   if(!root || !window.STORE)return;
   let el=document.querySelector('#knowledge-map-card');
   if(!el){el=document.createElement('a');el.id='knowledge-map-card';el.className='card pop knowledge-card';el.href='knowledge.html';root.appendChild(el)}
   const keys=['R1','R2','R3','R4'];const levels=keys.map(k=>STORE.level('knowledge',k)||{});
   const stars=levels.reduce((n,r)=>n+Math.max(0,Math.min(3,Number(r.stars)||0)),0);
   const done=levels.filter(r=>r.done).length;
   el.innerHTML='<div class="row between"><span class="kn-badge">🚀 四站知識挑戰</span><span class="tiny soft bold">'+(done===4?'🎉 全部完成':done?'進行中':'尚未開始')+'</span></div>'+
   '<div class="row mt2"><span style="font-size:2.8rem">🧠</span><div><h2 class="black">知識闖關特攻隊</h2><p class="small soft">4 站 · 40 題 · 錯題重新挑戰</p></div></div>'+
   '<p class="small mt1">二進位、編碼、影音數位化與電腦硬體，答對後看解析，完成四站收集特攻徽章。</p>'+
   '<div class="row between mt2 small bold"><span>⭐ '+stars+' / 12 · '+Math.round(stars/12*100)+'%</span><span>'+done+' / 4 站</span></div><div class="kn-progress"><i style="width:'+(stars/12*100)+'%"></i></div>';
 }
 // 登入可能比 load 後 700ms 更晚完成；監聽地圖真正渲染的時刻。
 // 僅在卡片尚未建立時觀察 DOM，避免更新卡片內容造成循環觸發。
 const hubRoot=document.getElementById('hub');
 const mapObserver=new MutationObserver(()=>{
   if(!document.getElementById('knowledge-map-card'))showKnowledge();
 });
 if(hubRoot)mapObserver.observe(hubRoot,{childList:true,subtree:true});
 window.addEventListener('load',showKnowledge);
 window.addEventListener('store:change',showKnowledge);
 window.addEventListener('pageshow',showKnowledge);
 window.addEventListener('storage',showKnowledge);
 window.addEventListener('focus',showKnowledge);
})();
</script>
</body>
</html>
