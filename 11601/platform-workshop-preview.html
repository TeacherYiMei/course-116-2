   $('#resetLab').onclick=()=>{if(!locked)ask();};
 }else if(q.kind==='order'){

 }else{
   q[1].forEach((v,i)=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(locked)return;$('#answers').querySelectorAll('button').forEach((x,j)=>{x.disabled=true;if(j===q[2])x.style.background='#c8f4dc';else if(j===i)x.style.background='#ffe1e6';});submit(i===q[2],q[3]);};$('#answers').appendChild(b);});

function result(){
 const count=unit.stages[phase].length,need=Math.ceil(count*.8),gained=pass>=need;
 if(gained){
   draft[unit.id]=Math.max(currentStars(unit.id),phase+1);
   if(official&&window.STORE&&STORE.me()){
     // 使用原 platform/G1~G8 鍵，saveLevel 只提高星等，不會覆寫既有高分。
     STORE.saveLevel('platform',unit.id,{stars:draft[unit.id],done:draft[unit.id]>=3,score:Math.round(pass/count*100)});
   }
 }
 const current=currentStars(unit.id);
 set('<section class="pv-panel"><h2>'+(gained?'🎉 任務完成！':'🌱 再試一次就更熟練！')+'</h2><p>本階完成 '+pass+' / '+count+' 題（過關門檻 '+need+' 題）</p><p class="pv-stars">'+stars(current)+'</p><p class="pv-good">'+(gained?'成功收集星星！':'先回顧教學，再挑戰同一階。')+'</p><p class="pv-tip">'+(official?'新星星沿用原 G1～G8 紀錄並同步至原學生帳號；不會降低舊星等。':'這些是測試星星，不會寫入 Firebase。')+'</p><div class="pv-buttons"><button class="pv-btn" id="continue">'+(gained&&current===3?'🏆 查看徽章':gained?'🚀 下一階':'🔄 再挑戰這一階')+'</button><button class="pv-btn secondary" id="back">← 八關地圖</button></div></section>');
 $('#continue').onclick=()=>{if(gained&&current===3){set('<section class="pv-panel"><h2>🏆 '+unit.name+' 三星達成！</h2><p class="pv-stars">★★★</p><p>恭喜完成三階任務！</p><p class="pv-tip">'+(official?'正式進度已送往學生資料庫同步。':'測試星星不會影響正式學生紀錄。')+'</p><button class="pv-btn" id="back">回八關地圖 →</button></section>');$('#back').onclick=menu;}else{phase=gained?Math.min(current,2):phase;asked=0;pass=0;ask();}};
 $('#back').onclick=menu;
}
menu();document.getElementById('quickCloudLab').onclick=()=>{unit=units.find(x=>x.id==='G7');phase=1;asked=0;pass=0;ask();};window.PLATFORM_V2_PREVIEW={units:units,oldStars:oldStars};
})();
